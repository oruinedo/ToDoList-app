name: Build and publish Windows portable app

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing release tag to build and publish"
        required: true
        type: string

permissions:
  contents: write

jobs:
  windows-portable:
    runs-on: windows-latest
    steps:
      - name: Check out release tag
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install locked build dependencies
        run: npm ci --include=dev --no-audit --no-fund

      - name: Build the standalone x64 EXE
        run: npm run package:portable

      - name: Create EXE checksum
        shell: powershell
        run: |
          $exe = Get-ChildItem release/portable/TodoDesktop-*-win32-x64.exe | Select-Object -First 1
          $hash = (Get-FileHash -LiteralPath $exe.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  $($exe.Name)" | Set-Content release/portable/SHA256SUMS.txt -Encoding ascii

      - name: Attach EXE to the tagged GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.tag || github.ref_name }}
          files: |
            release/portable/TodoDesktop-*-win32-x64.exe
            release/portable/SHA256SUMS.txt
          fail_on_unmatched_files: true
